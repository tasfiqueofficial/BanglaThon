<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004D38" />
      <stop offset="55%" stop-color="#006A4E" />
      <stop offset="100%" stop-color="#003624" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF3850" />
      <stop offset="65%" stop-color="#F42A41" />
      <stop offset="100%" stop-color="#C2001B" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001F16" flood-opacity="0.4" />
    </filter>
    <filter id="sunShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A0012" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Green Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104"
        fill="url(#bgGrad)" stroke="#34D399" stroke-opacity="0.35" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Red Sun -->
  <circle cx="256" cy="256" r="160" fill="url(#sunGrad)" filter="url(#sunShadow)" />
  
  <!-- Bengali Letter 'ব' -->
  <g fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Matra -->
    <path d="M 152 172 L 360 172" />
    <!-- Vertical stem -->
    <path d="M 314 172 L 314 344" />
    <!-- Triangular loop -->
    <path d="M 314 182 L 186 258 L 314 336" />
  </g>
  <circle cx="360" cy="172" r="7" fill="#6EE7B7" />
</svg>
